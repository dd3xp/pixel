# EXP-006: anchor each low-res level to the result handed down from the level above.
# Hypothesis: locking structure lets small SDS budgets refine without eroding.
seed: 0
device: cuda

prompt: a white daisy flower with a yellow center on a blue and white striped background
negative_prompt: ''
image: assets/test_images/flower2.png

scales: [128, 64, 48, 32, 24, 16]
steps_per_scale: [400, 200, 150, 120, 120, 120]

anchor_mode: carry        # reference = downsampled previous-level result
anchor_type: l1
anchor_weight: [0, 10, 20, 40, 60, 100]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1
save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
t_max: 0.98
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0
