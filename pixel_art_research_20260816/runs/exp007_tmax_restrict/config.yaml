# EXP-007: no anchor; instead restrict SDS noise level (t_max) at low-res levels.
# Hypothesis: low-noise SDS can only make local edits, so it refines without
# the mode-seeking power to restructure into blobs.
seed: 0
device: cuda

prompt: a single flower petal, blue and white, simple, centered
negative_prompt: ''
image: pixel_art_research_20260816/samples/db32_select_sample.png

scales: [256, 128, 64, 32, 16]
steps_per_scale: [400, 300, 250, 150, 150]

anchor_weight: 0.0
t_max_per_scale: [0.98, 0.98, 0.9, 0.7, 0.5]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1
save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0
