# P1 go/no-go: multi-scale pyramid vs single-scale (EXP-003) on the same case.
# Same source image, palette, CFG, teacher; only the scale schedule differs.
seed: 0
device: cuda

prompt: a single flower petal, blue and white, simple, centered
negative_prompt: ''
image: pixel_art_research_20260816/samples/db32_select_sample.png

scales: [256, 128, 64, 32, 16]
steps_per_scale: [200, 200, 250, 300, 400]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1

save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
t_max: 0.98
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0

anchor_weight: 0.0     # pure multi-scale test first; anchoring is P2
