# EXP-006: anchor each low-res level to the result handed down from the level above.
# Hypothesis: locking structure lets small SDS budgets refine without eroding.
seed: 0
device: cuda

prompt: a single flower petal, blue and white, simple, centered
negative_prompt: ''
image: pixel_art_research_20260816/samples/db32_select_sample.png

scales: [256, 128, 64, 32, 16]
steps_per_scale: [400, 300, 250, 150, 150]

anchor_mode: carry        # reference = downsampled previous-level result
anchor_type: l1
anchor_weight: [0, 5, 20, 60, 200]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1
save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
t_max: 0.98
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0
