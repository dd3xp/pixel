<title>Sprite Judgement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f2f3f6; --panel:#ffffff; --ink:#15161d; --ink-2:#5a6070; --line:#c9ccd6;
  --line-strong:#8b90a0; --accent:#2f5fe0; --accent-ink:#ffffff; --good:#1d7a4c; --warn:#b4471a;
  --board-a:#e9eaee; --board-b:#d8dae1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101118; --panel:#181a23; --ink:#e9eaf0; --ink-2:#9aa0b2; --line:#2e3140;
    --line-strong:#4a4f63; --accent:#6b93ff; --accent-ink:#0d0f16; --good:#49c98a; --warn:#ff9059;
    --board-a:#22242e; --board-b:#1a1c25;
  }
}
:root[data-theme="dark"]{
  --paper:#101118; --panel:#181a23; --ink:#e9eaf0; --ink-2:#9aa0b2; --line:#2e3140;
  --line-strong:#4a4f63; --accent:#6b93ff; --accent-ink:#0d0f16; --good:#49c98a; --warn:#ff9059;
  --board-a:#22242e; --board-b:#1a1c25;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55;
}
.wrap{max-width:900px; margin:0 auto; padding-inline:16px; padding-block:0 48px}
header{
  border-bottom:1px solid var(--line); background:var(--panel);
  position:sticky; top:0; z-index:5;
}
.bar{max-width:900px; margin:0 auto; padding-inline:16px; padding-block:12px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.mark{font-family:"Silkscreen",monospace; font-size:13px; letter-spacing:.02em}
.mark span{color:var(--accent)}
.count{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; margin-left:auto}
.pips{display:flex; gap:3px; flex-wrap:wrap}
.pip{width:10px; height:10px; background:var(--line); border:1px solid var(--line)}
.pip.done{background:var(--accent); border-color:var(--accent)}
.pip.now{background:var(--panel); border-color:var(--accent-strong,var(--accent))}
h1{font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:27px; line-height:1.25;
  text-wrap:balance; margin:32px 0 8px}
h2{font-size:19px; font-weight:600; margin:28px 0 8px; text-wrap:balance}
p{margin:0 0 14px; max-width:66ch}
.lede{color:var(--ink-2)}
.panel{background:var(--panel); border:1px solid var(--line); padding:20px; margin:20px 0}
.kicker{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-2); margin-bottom:6px}
.q{font-size:20px; font-weight:600; text-wrap:balance; margin:0 0 4px}
.cap{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2); margin:0 0 18px}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.pick{
  appearance:none; background:var(--panel); border:1px solid var(--line-strong);
  padding:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px;
  font:inherit; color:inherit; transition:border-color .08s linear, background .08s linear;
}
.pick:hover{border-color:var(--accent)}
.pick:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.pick img{
  width:100%; max-width:256px; height:auto; display:block;
  image-rendering:pixelated; border:1px solid var(--line);
  background:repeating-conic-gradient(var(--board-a) 0% 25%, var(--board-b) 0% 50%) 50%/16px 16px;
}
.key{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2)}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px}
button.go{
  appearance:none; font:inherit; font-weight:600; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent);
  padding:10px 20px;
}
button.go:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
button.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong)}
ul{margin:0 0 14px; padding-left:20px; max-width:66ch}
li{margin-bottom:6px}
.note{font-size:14px; color:var(--ink-2)}
textarea{
  width:100%; min-height:120px; font-family:"IBM Plex Mono",monospace; font-size:12px;
  background:var(--paper); color:var(--ink); border:1px solid var(--line-strong); padding:10px;
  resize:vertical;
}
.stat{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.saved{color:var(--good); font-weight:500}
.hint{border-left:3px solid var(--accent); padding-left:12px; margin:18px 0; color:var(--ink-2); font-size:14px}
@media (max-width:560px){
  .pair{grid-template-columns:1fr}
  h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="bar">
    <div class="mark">PIXEL<span>/</span>JUDGE</div>
    <div class="pips" id="pips" hidden></div>
    <div class="count" id="count"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<script>
/*__STUDY_DATA__*/

const $ = (s) => document.querySelector(s);
const main = $("#main"), pips = $("#pips"), count = $("#count");
const RID = "R" + Math.random().toString(36).slice(2, 8).toUpperCase();
const N_SCREEN = 6, N_JUDGE = 18;
let plan = [], at = 0, answers = [], t0 = 0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildPlan(){
  const judge = shuffle(STUDY.judge.slice()).slice(0, N_JUDGE);
  const screen = shuffle(STUDY.screen.slice()).slice(0, N_SCREEN);
  const items = shuffle(judge.concat(screen));
  return items.map(t => {
    const flip = Math.random() < 0.5;
    return {...t, flip,
      lImg: flip ? t.right_img : t.left_img,
      rImg: flip ? t.left_img : t.right_img,
      lSys: t.kind === "judge" ? (flip ? t.right : t.left) : null,
      rSys: t.kind === "judge" ? (flip ? t.left : t.right) : null,
      answerSide: t.kind === "screen" ? (flip ? (t.answer === "left" ? "right" : "left") : t.answer) : null};
  });
}

function chrome(){
  pips.hidden = false;
  pips.innerHTML = plan.map((_, i) =>
    `<i class="pip${i < at ? " done" : i === at ? " now" : ""}"></i>`).join("");
  count.textContent = `${Math.min(at + 1, plan.length)} / ${plan.length}`;
}

function intro(){
  count.textContent = "";
  main.innerHTML = `
    <h1>Which one is a real sprite?</h1>
    <p class="lede">You will see pairs of 16&times;16 game sprites, magnified. For each pair, pick one.
    About five minutes, ${N_SCREEN + N_JUDGE} pairs. Nothing personal is recorded.</p>
    <div class="panel">
      <div class="kicker">What you are looking at</div>
      <p>A sprite this small is drawn one pixel at a time: a few flat colours, hard edges, and a
      transparent background shown here as a grey chequer. Some of the images you will see were drawn
      that way. Others are larger artwork that was shrunk down to this size, which leaves soft edges
      and dozens of near-identical colours.</p>
      <p style="margin-bottom:0">Two questions alternate. One asks which image was <em>drawn</em> at this
      size; the other asks which you would rather put in a game. They can have different answers, and
      that is fine &mdash; answer each one as asked.</p>
    </div>
    <div class="hint">Use <span class="key">&larr;</span> and <span class="key">&rarr;</span> to answer
    from the keyboard, or just click an image.</div>
    <div class="row"><button class="go" id="start">Start</button></div>`;
  $("#start").onclick = () => { plan = buildPlan(); at = 0; answers = []; show(); };
}

function show(){
  if (at >= plan.length) return done();
  const t = plan[at];
  chrome();
  main.innerHTML = `
    <div class="kicker">Pair ${at + 1} of ${plan.length}</div>
    <p class="q">${t.text}</p>
    <p class="cap">${t.kind === "judge" && t.prompt ? "Both were made for: " + esc(t.prompt) : "Both are sprites from a real game-art archive."}</p>
    <div class="pair">
      <button class="pick" data-side="left">
        <img src="${t.lImg}" alt="Left sprite">
        <span class="key">&larr; left</span>
      </button>
      <button class="pick" data-side="right">
        <img src="${t.rImg}" alt="Right sprite">
        <span class="key">right &rarr;</span>
      </button>
    </div>`;
  document.querySelectorAll(".pick").forEach(b => b.onclick = () => answer(b.dataset.side));
  t0 = performance.now();
}

function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function answer(side){
  const t = plan[at];
  const rec = {id: t.id, kind: t.kind, question: t.question, side, ms: Math.round(performance.now() - t0)};
  if (t.kind === "judge"){ rec.chose = side === "left" ? t.lSys : t.rSys; rec.over = side === "left" ? t.rSys : t.lSys; }
  else { rec.correct = side === t.answerSide; }
  answers.push(rec);
  at++;
  show();
}

document.addEventListener("keydown", (e) => {
  if (at >= plan.length || !plan.length) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); answer("left"); }
  if (e.key === "ArrowRight") { e.preventDefault(); answer("right"); }
});

function payload(){
  const scr = answers.filter(a => a.kind === "screen");
  return {v: 1, rater: RID, at: new Date().toISOString(),
          screenPassed: scr.filter(a => a.correct).length, screenTotal: scr.length,
          answers};
}

async function done(){
  pips.hidden = true; count.textContent = "";
  const p = payload();
  const code = "PXS1:" + btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  main.innerHTML = `
    <h1>Done &mdash; thank you</h1>
    <p class="lede">You answered ${p.answers.length} pairs. Your rater code is
    <span class="stat">${p.rater}</span>.</p>
    <div class="panel">
      <div class="kicker">Send this back</div>
      <p class="note" id="savedLine">Copy the block below and send it to whoever asked you to do this.</p>
      <textarea id="code" readonly>${code}</textarea>
      <div class="row">
        <button class="go" id="copy">Copy</button>
        <span class="note" id="copied"></span>
      </div>
    </div>
    <p class="note">The screening pairs had a right answer &mdash; two real sprites, one drawn at this
    size and one shrunk to it. You got <span class="stat">${p.screenPassed}/${p.screenTotal}</span>.
    That number is used to weigh the rest of your answers, not to grade you.</p>`;
  $("#copy").onclick = async () => {
    const ta = $("#code");
    try { await navigator.clipboard.writeText(ta.value); }
    catch { ta.select(); document.execCommand("copy"); }
    $("#copied").textContent = "Copied.";
  };
  try {
    const db = await window.claude?.use?.("db");
    if (db) {
      await db.doc("responses/" + p.rater).set(p);
      $("#savedLine").innerHTML = '<span class="saved">Saved automatically.</span> You can also copy the block below as a backup.';
    }
  } catch (e) { /* link visitors cannot write; the copy block is the path that always works */ }
}

intro();
</script>
