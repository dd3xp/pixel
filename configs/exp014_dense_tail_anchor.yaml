# EXP-014: dense-tail scale schedule (p~2: [128,64,48,32,24,16]) + carry anchor.
# Hypothesis: most information loss happens at small scales, so sample them densely;
# each small hop transfers structure with little loss and needs only a short refine.
seed: 0
device: cuda

prompt: a single flower petal, blue and white, simple, centered
negative_prompt: ''
image: pixel_art_research_20260816/samples/db32_select_sample.png

scales: [128, 64, 48, 32, 24, 16]
steps_per_scale: [400, 200, 150, 120, 120, 120]

anchor_mode: carry
anchor_type: l1
anchor_weight: [0, 10, 20, 40, 60, 100]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1
save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
t_max: 0.98
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0
