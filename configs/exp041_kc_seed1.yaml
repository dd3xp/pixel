# EXP-006: anchor each low-res level to the result handed down from the level above.
# Hypothesis: locking structure lets small SDS budgets refine without eroding.
seed: 1
device: cuda

prompt: a white daisy flower with a yellow center on a blue and white striped background
negative_prompt: ''
image: assets/test_images/flower2.png

scales: [128, 64, 48, 40, 32, 28, 24, 20, 16]
steps_per_scale: [400, 150, 100, 100, 100, 100, 100, 100, 100]

anchor_mode: flatbg        # reference = downsampled previous-level result
anchor_type: l1
anchor_weight: [0, 0.3, 0.5, 1, 1.5, 2, 2.5, 3, 3]

palette: assets/palettes/dawnbringer32.hex
init_distance: l1
save_steps: 50
lr: 0.025
guidance_scale: 40.0
grad_scale: 1.0
t_min: 0.02
t_max: 0.98
render_size: 1024
tau_min: 0.5
tau_max: 1.5
hflip_prob: 0.5
clip_grad: true
max_grad_norm: 1.0
mask: assets/masks/flower2_mask.png
bg_weight_min: 0.0
grad_combine: norm
prompt_per_scale:
  - a white daisy flower with a yellow center on a blue and white striped background
  - a white daisy flower with a yellow center on a blue and white striped background
  - a white daisy flower with a yellow center on a blue and white striped background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
  - a simple pixel art icon of a white daisy flower with a bright yellow center, plain background
flatbg_color: mode
bg_snap: true
despeckle: true
downsample: kcentroid
